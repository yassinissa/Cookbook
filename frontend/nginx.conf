# Cookbook SPA — served by nginx inside the frontend container.
# TLS, gzip and /api,/media,/static routing are handled one layer up
# (Caddy in docker-compose, or Coolify's proxy). This just serves the
# built assets with the right cache headers + SPA history fallback.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Hashed build assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA plumbing — must always revalidate so a new deploy is picked up.
    location = /sw.js            { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /registerSW.js    { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ~* ^/workbox-.*\.js$ { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Everything else → SPA entry (client-side router handles /m/<slug>, etc.).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Don't log health-probe noise.
    location = /healthz { access_log off; return 200 "ok\n"; }
}
