name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests + migration check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # base.py reads SECRET_KEY with no default; the value is irrelevant for
      # the test run. Everything else has a sane default in settings/base.py.
      SECRET_KEY: ci-not-a-real-secret
      DJANGO_SETTINGS_MODULE: config.settings.development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Deploy pins the exact patch (backend/runtime.txt = 3.12.10); CI
          # tracks the newest 3.12.x the runner ships — patch releases are
          # bugfix-only and Actions drops old ones from the ubuntu image.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - run: pip install -r requirements/development.txt

      - name: Migrations are in sync with the models
        run: python manage.py makemigrations --check --dry-run

      - name: Test suite
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend — typecheck + lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      - run: npm run build
